[package]
name = "codenotch-core"
version = "0.2.3"
description = "Platform-agnostic telemetry collection for CodeNotch"
license = "MIT"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

# native-tls => schannel on Windows: no bundled C crypto, uses the OS trust store.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "native-tls",
  "system-proxy",
] }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7"
walkdir = "2"
rand = "0.10"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
] }

# Claude Code's login lives in the keychain on macOS. Already in the tree,
# through native-tls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
