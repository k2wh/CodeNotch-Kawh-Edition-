name: Release

# Builds the three installers from a release's own tag, each on the system it
# is for, and attaches them to the release.
#
# It does not sign them. An installed copy only accepts an update signed with
# this project's key, and that key stays on the maintainer's machine rather
# than in a secret here: `packaging/sign-release.sh` signs the files this
# workflow attached and adds the `latest.json` that installed copies read.
# Until it runs, a release is something to install by hand, which is what the
# download links are for anyway.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to build and attach to, e.g. v0.2.0 (empty = only build)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # An app that says 0.2.0 while the release says 0.2.1 would offer itself
      # an update for ever.
      - name: Check
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "the app says $version, the tag says ${TAG:-(none)}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          for file in package.json src-tauri/Cargo.toml; do
            grep -q "\"\?version\"\?\s*[:=]\s*\"$version\"" "$file" ||
              echo "::warning::$file doesn't carry version $version"
          done

  windows:
    name: windows installer
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  linux:
    name: linux package
    needs: version
    # Ubuntu 22.04, the base Pop!_OS 22.04 shares, so the .deb runs on both.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-release

      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - run: npm ci

      - name: Build the package
        run: npx tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos:
    name: macos installer
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-release

      # On CI Tauri skips having Finder lay out the .dmg window, in case Finder
      # doesn't answer there. GitHub's Macs let it, so ask for the layout a Mac
      # build gets, and fall back to a plain .dmg if Finder doesn't cooperate.
      - name: Build the app and the .dmg
        run: |
          if ! TAURI_BUNDLER_DMG_IGNORE_CI=true bash packaging/macos/build.sh; then
            echo "::warning::Finder didn't lay out the .dmg window; building a plain one"
            rm -rf src-tauri/target/universal-apple-darwin/release/bundle/dmg
            bash packaging/macos/build.sh
          fi

      - name: Check the bundle
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          apps=("$bundle"/macos/*.app); app=${apps[0]}
          dmgs=("$bundle"/dmg/CodeNotch_*.dmg); dmg=${dmgs[0]}
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          # One binary for both kinds of Mac, signed, in a sound disk image.
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          [[ $archs == *x86_64* && $archs == *arm64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg"
          { echo "EXE=$exe"; echo "DMG=$dmg"; } >> "$GITHUB_ENV"

      # The code is tested on every push; this shows the app itself starts on
      # a real Mac and puts its panel on screen.
      - name: Launch it
        timeout-minutes: 5
        run: |
          mkdir -p smoke
          "$EXE" > smoke/app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::CodeNotch quit at launch"
            cat smoke/app.log
            exit 1
          fi
          cat > "$RUNNER_TEMP/windows.swift" <<'EOF'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          print("display", CGDisplayBounds(CGMainDisplayID()))
          let all = CGWindowListCopyWindowInfo(.optionAll, kCGNullWindowID) as? [[String: Any]] ?? []
          for w in all where w[kCGWindowOwnerPID as String] as? Int == pid {
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            print("layer", w[kCGWindowLayer as String] ?? "?",
                  "onscreen", w[kCGWindowIsOnscreen as String] ?? 0,
                  "x", b["X"] ?? "?", "y", b["Y"] ?? "?",
                  "w", b["Width"] ?? "?", "h", b["Height"] ?? "?")
          }
          EOF
          swift "$RUNNER_TEMP/windows.swift" "$pid" | tee smoke/windows.txt || true
          screencapture -x smoke/screen.png || true
          kill "$pid"
          cat smoke/app.log

      # What the updater replaces an installed app with: the .app as a
      # gzipped tar, which is the shape the plugin unpacks — the bundler makes
      # this one itself when it has a key, and it doesn't here.
      - name: Pack the app for the updater
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle/macos
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tar -czf "$bundle/CodeNotch_${version}_universal.app.tar.gz" -C "$bundle" CodeNotch.app
          tar -tzf "$bundle/CodeNotch_${version}_universal.app.tar.gz" | head -3
          ls -la "$bundle"

      # Gathered into one folder first: an artifact made from paths with
      # nothing in common keeps the whole tree they came from, and the job
      # that attaches them would have to know that tree.
      - name: Gather what ships
        run: |
          set -euo pipefail
          mkdir -p out
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/CodeNotch_*.dmg "$bundle"/macos/*.app.tar.gz out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: smoke/
          if-no-files-found: warn

  publish:
    name: attach to the release
    needs: [windows, linux, macos]
    if: ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la assets/*/
          # Found by name rather than by folder, so a build's artifact can
          # arrive in whatever shape it likes.
          mapfile -t files < <(find assets -type f \
            \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.app.tar.gz' \) | sort)
          printf 'attaching %s\n' "${files[@]}"
          if [ ${#files[@]} -ne 4 ]; then
            echo "::error::expected the four files that ship, found ${#files[@]}"
            exit 1
          fi
          gh release upload "$TAG" --clobber "${files[@]}"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'

      # Signing happens on the maintainer's machine, where the key is: see
      # packaging/sign-release.sh. Until it has run, an installed copy finds
      # no update and this release is one to install by hand.
      - name: Say what is still missing
        run: |
          echo "::notice::installers attached. Run 'bash packaging/sign-release.sh $TAG' to sign them and publish latest.json."
