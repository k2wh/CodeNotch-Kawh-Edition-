name: Release

# Builds the three installers from a release's own tag, each on the system it
# is for, signs them with the updater key, and attaches them to the release
# along with the `latest.json` that installed copies read to find the next
# version.
#
# The signing key lives in the TAURI_SIGNING_PRIVATE_KEY secret. Without it an
# installed app refuses an update, so a release built anywhere else can't
# reach anyone.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to build and attach to, e.g. v0.2.0 (empty = only build)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # Updater archives and signatures are only made here, where the key is; a
  # build on someone's own machine needs neither.
  UPDATER: '{"bundle":{"createUpdaterArtifacts":true}}'
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  version:
    name: version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # An app that says 0.2.0 while the release says 0.2.1 would offer itself
      # an update for ever.
      - name: Check
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "the app says $version, the tag says ${TAG:-(none)}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          for file in package.json src-tauri/Cargo.toml; do
            grep -q "\"\?version\"\?\s*[:=]\s*\"$version\"" "$file" ||
              echo "::warning::$file doesn't carry version $version"
          done

  windows:
    name: windows installer
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis --config "$UPDATER"

      - name: Check it was signed
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          test -f src-tauri/target/release/bundle/nsis/*-setup.exe.sig

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error

  linux:
    name: linux package
    needs: version
    # Ubuntu 22.04, the base Pop!_OS 22.04 shares, so the .deb runs on both.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-release

      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - run: npm ci

      - name: Build the package
        run: npx tauri build --bundles deb --config "$UPDATER"

      # The updater installs the .deb itself, so it needs a signature beside
      # it. Signed here if the bundler didn't.
      - name: Sign it
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          if [ ! -f "$deb.sig" ]; then
            echo "signing $deb"
            npx tauri signer sign "$deb"
          fi
          ls -la src-tauri/target/release/bundle/deb/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/deb/*.deb*
          if-no-files-found: error

  macos:
    name: macos installer
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-release

      # On CI Tauri skips having Finder lay out the .dmg window, in case Finder
      # doesn't answer there. GitHub's Macs let it, so ask for the layout a Mac
      # build gets, and fall back to a plain .dmg if Finder doesn't cooperate.
      - name: Build the app and the .dmg
        run: |
          if ! TAURI_BUNDLER_DMG_IGNORE_CI=true bash packaging/macos/build.sh --config "$UPDATER"; then
            echo "::warning::Finder didn't lay out the .dmg window; building a plain one"
            rm -rf src-tauri/target/universal-apple-darwin/release/bundle/dmg
            bash packaging/macos/build.sh --config "$UPDATER"
          fi

      - name: Check the bundle
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app=$(ls -d "$bundle"/macos/*.app)
          dmg=$(ls "$bundle"/dmg/CodeNotch_*.dmg)
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          # One binary for both kinds of Mac, signed, in a sound disk image,
          # with the signed archive the updater replaces it from.
          archs=$(lipo -archs "$exe")
          echo "architectures: $archs"
          [[ $archs == *x86_64* && $archs == *arm64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg"
          test -f "$bundle/macos/CodeNotch.app.tar.gz.sig"
          shasum -a 256 "$dmg"
          { echo "EXE=$exe"; echo "DMG=$dmg"; } >> "$GITHUB_ENV"

      # The code is tested on every push; this shows the app itself starts on
      # a real Mac and puts its panel on screen.
      - name: Launch it
        timeout-minutes: 5
        run: |
          mkdir -p smoke
          "$EXE" > smoke/app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::CodeNotch quit at launch"
            cat smoke/app.log
            exit 1
          fi
          cat > "$RUNNER_TEMP/windows.swift" <<'EOF'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          print("display", CGDisplayBounds(CGMainDisplayID()))
          let all = CGWindowListCopyWindowInfo(.optionAll, kCGNullWindowID) as? [[String: Any]] ?? []
          for w in all where w[kCGWindowOwnerPID as String] as? Int == pid {
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            print("layer", w[kCGWindowLayer as String] ?? "?",
                  "onscreen", w[kCGWindowIsOnscreen as String] ?? 0,
                  "x", b["X"] ?? "?", "y", b["Y"] ?? "?",
                  "w", b["Width"] ?? "?", "h", b["Height"] ?? "?")
          }
          EOF
          swift "$RUNNER_TEMP/windows.swift" "$pid" | tee smoke/windows.txt || true
          screencapture -x smoke/screen.png || true
          kill "$pid"
          cat smoke/app.log

      # The archive carries the version in its name here, so a release's
      # assets say which build they are.
      - name: Name the updater archive after its version
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle/macos
          version=$(jq -r .version src-tauri/tauri.conf.json)
          for suffix in "" ".sig"; do
            mv "$bundle/CodeNotch.app.tar.gz$suffix" \
               "$bundle/CodeNotch_${version}_universal.app.tar.gz$suffix"
          done
          ls -la "$bundle"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/CodeNotch_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            smoke/
          if-no-files-found: warn

  publish:
    name: attach to the release
    needs: [windows, linux, macos]
    if: ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: assets

      # `latest.json` is what an installed copy reads: the version on offer,
      # the notes it shows, and per platform the file to download with the
      # signature it has to match. The keys are the ones the updater asks for,
      # `{os}-{arch}-{installer}` first and `{os}-{arch}` after it.
      - name: Write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          exe=$(ls assets/windows/*-setup.exe)
          deb=$(ls assets/linux/*.deb)
          app=$(ls assets/macos/*.app.tar.gz)
          notes=$(gh release view "$TAG" --json body --jq .body)

          entry() { jq -n --arg url "$base/$(basename "$1")" --arg sig "$(cat "$1.sig")" \
            '{signature: $sig, url: $url}'; }
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry "$exe")" \
            --argjson linux "$(entry "$deb")" \
            --argjson mac "$(entry "$app")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
               "windows-x86_64-nsis": $windows,
               "windows-x86_64": $windows,
               "linux-x86_64-deb": $linux,
               "linux-x86_64": $linux,
               "darwin-aarch64-app": $mac,
               "darwin-aarch64": $mac,
               "darwin-x86_64-app": $mac,
               "darwin-x86_64": $mac
             }}' > latest.json
          cat latest.json | head -20

      - name: Attach everything
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The installers first and the manifest last: until it is there, an
          # installed copy sees no update rather than a broken one.
          gh release upload "$TAG" --clobber \
            assets/windows/*-setup.exe \
            assets/windows/*-setup.exe.sig \
            assets/linux/*.deb \
            assets/linux/*.deb.sig \
            assets/macos/*.dmg \
            assets/macos/*.app.tar.gz \
            assets/macos/*.app.tar.gz.sig
          gh release upload "$TAG" --clobber latest.json
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
