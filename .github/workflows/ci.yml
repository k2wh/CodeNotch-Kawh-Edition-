name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The app never needs a debug symbol server, and CI disks are small.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  core:
    name: core tests (${{ matrix.os }})
    # codenotch-core has no Tauri or GUI dependency, so it is tested on Linux
    # for speed and on Windows because that is where it actually ships.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Test
        working-directory: src-tauri/core
        run: cargo test --all-features

      - name: Clippy
        working-directory: src-tauri/core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test fixtures are reproducible
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/gen_test_fixtures.py
          cd src-tauri/core && cargo test

  windows-check:
    name: windows type-check (from Linux)
    # The whole application, Win32 layer included, type-checks without a Windows
    # runner because it pulls in no C-compiled dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: win-check

      # tauri-build needs the frontend output directory to exist.
      - run: mkdir -p dist && touch dist/index.html

      # tauri-build compiles a Windows resource file (icon, version info) even
      # for `cargo check`, and off-Windows it shells out to `llvm-rc`. Without
      # it the build script panics with NotAttempted("llvm-rc").
      - name: Install the Windows resource compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          # The `llvm` package normally provides an unversioned symlink; fall
          # back to the highest versioned binary if this release doesn't.
          if ! command -v llvm-rc >/dev/null; then
            sudo ln -s "$(ls /usr/bin/llvm-rc-* | sort -V | tail -1)" /usr/local/bin/llvm-rc
          fi
          llvm-rc /? >/dev/null 2>&1 || true
          command -v llvm-rc

      - name: Check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

  linux-check:
    name: linux app (clippy, tests)
    # The base Pop!_OS 22.04 and Ubuntu 22.04 share, which the .deb targets.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-app

      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # tauri-build needs the frontend output directory to exist.
      - run: mkdir -p dist && touch dist/index.html

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  macos-check:
    name: macos app (clippy, build, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-app

      - run: mkdir -p dist && touch dist/index.html

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A build links, where a check doesn't: it shows AppKit and the keychain
      # resolve on a real Mac.
      - name: Build
        working-directory: src-tauri
        run: cargo build

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  build:
    name: windows installer
    needs: [core, windows-check, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle

      - run: npm ci

      - name: Build installers
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
